<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downstage Find</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Downstage Find: every Downstage device on this network, and a button for each of its apps.
     The Mac or iOS app does the finding (shared/Finder.swift) and calls window.devices() with what it knows. -->
<style>
  @font-face { font-family: 'Rajdhani'; font-weight: 700; src: url('fonts/rajdhani-700.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/inter-600.woff2') format('woff2'); }
  :root { --ground: #0B0D10; --panel: #12161B; --raised: #181D23; --edge: #232A32; --text: #E8ECEF; --muted: #9AA4AD;
          --green: #2FD97B; --amber: #F5A524; --red: #E5484D; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--ground); color: var(--text); font: 400 14px/1.4 'Inter', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  header { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header h1 { margin: 0; font: 700 17px 'Rajdhani', system-ui, sans-serif; white-space: nowrap; }
  header svg { width: 24px; height: 24px; flex: none; }
  input, button { box-sizing: border-box; height: 34px; min-height: 34px; padding: 0 10px; font: 400 14px/1 'Inter', system-ui, sans-serif; color: var(--text); background-color: var(--raised); border: 1px solid var(--edge); }
  input { border-radius: 4px; -webkit-user-select: text; user-select: text; }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; border-color: var(--muted); }
  button { border-radius: 6px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  input { width: 170px; }
  button:disabled { opacity: .5; cursor: default; }
  .sp { flex: 1; }
  #upd { display: none; flex: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 14px; font-size: 13px; background: var(--raised); border-bottom: 1px solid var(--edge); }
  #upd.on { display: flex; }
  #updText { flex: 1; min-width: 160px; }
  #upd button { min-height: 28px; padding: 2px 10px; }
  #updGo { border-color: var(--green); }
  #say { flex: none; padding: 8px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--edge); }
  #say:empty { display: none; }
  #say.warn { color: var(--amber); }
  main { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 14px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; }
  .card.gone { opacity: .55; }
  .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .icon { flex: none; width: 52px; height: 52px; object-fit: contain; }
  .who { min-width: 0; flex: 1; }
  .name { font: 700 18px/1.15 'Rajdhani', system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addr { font-size: 12.5px; color: var(--muted); -webkit-user-select: text; user-select: text; }
  .live { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  .gone .live { background: var(--red); }
  .health { margin-top: -4px; font-size: 13px; color: var(--green); }
  .health.warn { color: var(--amber); }
  .bright { display: flex; flex-direction: column; gap: 2px; margin-top: -4px; }
  .bright label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .bright label > span { flex: none; width: 74px; }
  .bright input { flex: 1; width: auto; min-width: 0; height: 26px; min-height: 0; padding: 0; border: 0; background: none; accent-color: var(--green); }
  .bright b { flex: none; width: 38px; text-align: right; font-weight: 600; color: var(--text); }
  .bright .note { font-size: 12px; color: var(--muted); }
  .apps { display: flex; flex-wrap: wrap; gap: 6px; }
  .apps button.main { border-color: var(--green); }
  #pull { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: var(--muted); }
  #pull.back { transition: height .2s; }
  #empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  #empty b { display: block; margin-bottom: 6px; color: var(--text); font: 700 20px 'Rajdhani', system-ui, sans-serif; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 96 96" aria-hidden="true"><rect x="6" y="10" width="84" height="66" rx="10" fill="none" stroke="#e8ecef" stroke-width="7"/><rect x="20" y="54" width="40" height="9" rx="4.5" fill="#2fd97b"/><rect x="64" y="54" width="12" height="9" rx="4.5" fill="#e8ecef" opacity="0.28"/><rect x="20" y="83" width="56" height="7" rx="3.5" fill="#2fd97b"/></svg>
  <h1>Downstage Find</h1>
  <span class="sp"></span>
  <input id="addr" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Add by address" title="A device's address, for a network that hides devices from each other">
  <button id="scan" title="Knock on every address on this network, for when a device isn't answering the normal search">Scan network…</button>
  <button id="refresh" title="Ask the network again">Refresh</button>
</header>
<div id="upd"><span id="updText"></span><button id="updGo">Update now</button><button id="updLater">Later</button></div>
<div id="say"></div>
<main>
  <div id="pull"></div>
  <div id="grid"></div>
  <div id="empty"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const native = (action, extra) => { try { window.webkit.messageHandlers.find.postMessage(Object.assign({ action }, extra)); } catch (e) {} };
  const KINDS = {
    one: ['Downstage One', 'devices/one.svg'], view: ['Downstage View', 'devices/view.png'], relay: ['Cue Relay', 'devices/relay.svg'],
    cue: ['Cue', 'devices/cue.svg'], tally: ['Cue', 'devices/cue.svg'], lite: ['Cue Lite', 'devices/lite.svg'],
    mini: ['Cue Mini', 'devices/mini.svg'], 360: ['Cue 360', 'devices/360.svg'],
  };
  const ORDER = ['one', 'view', 'relay', 'cue', 'tally', 'lite', 'mini', '360'];
  let list = [], started = Date.now(), searching = true, blinking = {}, held = {}, sliding = false;

  function appsOf(d) {
    const base = 'http://' + d.host, page = base + ':' + d.port;
    // a device's own page is its Settings, on every device (Rob, 2026-11-03)
    if (d.kind !== 'one') return [{ name: 'Settings', url: page + '/', main: true }];
    const a = [{ name: 'Settings', url: page + '/', main: true }, { name: 'Touch', url: page + '/touch' }];
    if (d.hasApps) a.push({ name: 'Apps', url: page + '/?tab=apps' });
    if (d.companion) a.push({ name: 'Companion', url: base + ':8000/' });
    if (d.ontime) a.push({ name: 'OnTime', url: base + ':4001/editor/' });
    return a;
  }
  // A light's health in one line, worded like its own page: amber when something needs a look
  function healthOf(d) {
    const h = d.health, c = String(h && h.companion || '');
    if (!h || d.gone || !Object.keys(h).length) return null;
    const near = id => { const o = list.find(x => x.key === id); return o ? o.name : 'its Relay'; };
    let warn = true, text;
    if (h.setup) text = 'In setup: join its hotspot to choose a network';
    else if (h.why) text = h.why;
    else if (h.relayed) { warn = false; text = 'Live, linked to ' + near(h.via); }
    else if (/^live/.test(c)) { warn = false; text = 'Live on Companion'; }
    else if (/no Companion host/.test(c)) text = 'No Companion set';
    else if (/its Cue/.test(c)) text = 'Waiting for the Cue it is linked to';
    else if (/network/.test(c)) text = 'Waiting for a network';
    else text = 'Finding Companion';
    const more = [];
    if (h.weak === 1 || (!h.relayed && h.ssid && h.rssi < -75)) { warn = true; more.push('Weak WiFi' + (h.rssi ? ' (' + h.rssi + ' dBm)' : '')); }
    if (h.weak === 2) { warn = true; more.push('Weak CueLink'); }
    if (typeof h.battery === 'number') {
      const low = h.battery < 20 && !h.charging;
      if (low) warn = true;
      more.push('Battery ' + h.battery + '%' + (h.charging ? ', charging' : ''));
    }
    return { warn, text: [text].concat(more).join(' · ') };
  }
  // A light's own brightness and its Hex's, where its /status has them (0.186.38): always a percent, 1-100. A value
  // just sent is held until the light reports it, so the slider doesn't jump back while the next look is on its way
  function brightOf(d) {
    const h = d.health || {}, rows = [];
    if (typeof h.brightpct === 'number') rows.push(['light', 'Brightness', h.brightpct, !!h.tokenSet]);
    if (typeof h.hexBright === 'number') rows.push(['hex', 'Hex', h.hexBright, false]);
    if (!rows.length || d.gone) return '';
    const html = rows.map(([part, label, v, locked]) => {
      const id = d.key + ':' + part, w = held[id];
      if (w && (w.pct === v || Date.now() > w.until)) delete held[id];
      const pct = held[id] ? held[id].pct : v;
      return '<label' + (locked ? ' title="This light has a Cue PIN. Change its brightness in Settings."' : '') + '><span>' + label + '</span>' +
             '<input type="range" min="1" max="100" step="1" value="' + pct + '" data-key="' + esc(d.key) + '" data-part="' + part + '"' + (locked ? ' disabled' : '') + '>' +
             '<b>' + pct + '%</b></label>';
    }).join('');
    return '<div class="bright">' + html + (rows.some(r => r[3]) ? '<div class="note">Cue PIN set: change its brightness in Settings</div>' : '') + '</div>';
  }
  function draw() {
    const sorted = list.slice().sort((a, b) => (ORDER.indexOf(a.kind) - ORDER.indexOf(b.kind)) || String(a.name).localeCompare(String(b.name)));
    $('grid').innerHTML = sorted.map(d => {
      const k = KINDS[d.kind] || KINDS.cue;
      const sub = [k[0], d.version].filter(Boolean).join(' · ');
      const btns = appsOf(d).map(a => '<button class="' + (a.main ? 'main' : '') + '" data-url="' + esc(a.url) + '"' + (d.gone ? ' disabled' : '') + '>' + esc(a.name) + '</button>').join('') +
        (d.kind === 'one' || d.kind === 'view' ? '' : '<button data-blink="' + esc(d.key) + '" title="Blink this ' + (d.kind === 'relay' ? 'Relay' : 'light') + ' so you can see which one it is"' + (d.gone || blinking[d.key] ? ' disabled' : '') + '>' + (blinking[d.key] ? 'Blinking…' : 'Identify') + '</button>');
      const h = healthOf(d);
      return '<div class="card' + (d.gone ? ' gone' : '') + '"><div class="head"><img class="icon" alt="" src="' + esc(k[1]) + '"><div class="who"><div class="name">' + esc(d.name) + '</div><div class="sub">' + esc(sub) + '</div></div><span class="live" title="' + (d.gone ? 'Not answering' : 'On the network') + '"></span></div>' +
             '<div class="addr">' + esc(d.host) + (d.serial ? ' · ' + esc(d.serial) : '') + '</div>' +
             (h ? '<div class="health' + (h.warn ? ' warn' : '') + '">' + esc(h.text) + '</div>' : '') + brightOf(d) + '<div class="apps">' + btns + '</div></div>';
    }).join('');
    const none = !list.length;
    $('empty').style.display = none ? '' : 'none';
    if (none) {
      const waited = Date.now() - started > 5000;
      $('empty').innerHTML = waited
        ? '<b>Nothing found yet</b>Check ' + (window.downstageMobile ? 'Local Network is on for this app in Settings, and that this ' + window.downstageMobile : 'this Mac') + ' is on the same network as your devices. Some networks hide devices from each other: add one by its address, or use Scan network.'
        : '<b>Looking…</b>Asking the network for Downstage devices.';
    }
  }
  // a card redrawn mid-drag would drop the slider out from under the finger, so a drag holds the redraws
  window.devices = d => { list = d; if (!sliding) draw(); };
  window.findSay = (text, warn) => { $('say').textContent = text || ''; $('say').className = warn ? 'warn' : ''; };
  window.scanState = running => { $('scan').disabled = running; $('scan').textContent = running ? 'Scanning…' : 'Scan network…'; };

  // ── updates: only inside the Mac app (macapp/updater.swift). A check at launch stays quiet unless there's
  // something new, because a venue network with no internet isn't news. Nothing installs until it's pressed ──
  const updBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.updates;
  let updLater = false;
  window.updAsked = false;
  window.updateState = u => {
    const line = { checking: 'Checking for updates…', current: u.message || 'You\u2019re up to date.', available: 'Version ' + u.latest + ' is ready.', downloading: 'Downloading ' + u.latest + '…',
                   installing: 'Installing ' + u.latest + '. The app will reopen.', error: u.message || 'Couldn\u2019t update.' }[u.status];
    const news = ['available', 'downloading', 'installing'].includes(u.status);
    if (window.updAsked) updLater = false;
    $('upd').classList.toggle('on', !!line && !updLater && (news || window.updAsked));
    $('updText').textContent = 'This is version ' + u.version + '. ' + (line || '');
    $('updText').title = u.status === 'available' ? (u.notes || '') : '';
    $('updGo').style.display = u.status === 'available' ? '' : 'none';
    $('updLater').style.display = u.status === 'installing' || u.status === 'downloading' ? 'none' : '';
    $('updLater').textContent = u.status === 'available' ? 'Later' : 'Close';
  };
  if (updBridge) {
    $('updGo').onclick = () => { window.updAsked = true; updBridge.postMessage('install'); };
    $('updLater').onclick = () => { updLater = true; window.updAsked = false; $('upd').classList.remove('on'); };
    updBridge.postMessage('ready');
  }

  $('grid').addEventListener('click', e => {
    const b = e.target.closest('button[data-url]');
    if (b) return native('open', { url: b.dataset.url });
    // the light blinks for about 5 s, so the button rests that long and a second press doesn't stack
    const k = (e.target.closest('button[data-blink]') || {}).dataset;
    if (!k || !k.blink) return;
    const key = k.blink;
    native('identify', { key });
    blinking[key] = setTimeout(() => { delete blinking[key]; draw(); }, 5000);
    draw();
  });
  // the number follows the drag; the light hears once, when the slider is let go (each change is written to its flash)
  $('grid').addEventListener('pointerdown', e => { if (e.target.matches('input[type=range]')) sliding = true; });
  $('grid').addEventListener('input', e => {
    if (e.target.matches('input[type=range]')) e.target.nextElementSibling.textContent = e.target.value + '%';
  });
  $('grid').addEventListener('change', e => {
    const r = e.target;
    if (!r.matches('input[type=range]')) return;
    const pct = Math.max(1, Math.min(100, Math.round(+r.value)));
    held[r.dataset.key + ':' + r.dataset.part] = { pct, until: Date.now() + 5000 };
    native('bright', { key: r.dataset.key, part: r.dataset.part, pct });
    sliding = false; draw();
  });
  const letGo = () => { if (sliding) setTimeout(() => { if (sliding) { sliding = false; draw(); } }, 0); };
  window.addEventListener('pointerup', letGo);
  window.addEventListener('pointercancel', letGo);
  $('refresh').onclick = () => { started = Date.now(); window.findSay(''); native('refresh'); draw(); };
  $('scan').onclick = () => {
    if (confirm('Scan this network?\n\nThis knocks on every address on your network. It takes a few seconds, but some venue networks treat it as an attack, so ask first if it isn’t your network.')) native('scan');
  };
  $('addr').onchange = () => {
    const v = $('addr').value.trim().replace(/^https?:\/\//, '').replace(/[:/].*$/, '');
    $('addr').value = '';
    if (v) native('add', { host: v });
  };
  // pull the list down to refresh, on touch screens: from the top of the list, past 64 px, then let go
  (() => {
    const main = document.querySelector('main'), pull = $('pull'), FAR = 64;
    let from = null, dy = 0;
    const show = (h, text) => { pull.style.height = h + 'px'; pull.textContent = text; };
    main.addEventListener('touchstart', e => {
      // a brightness slider is dragged, not pulled
      from = main.scrollTop <= 0 && e.touches.length === 1 && !e.target.closest('input[type=range]') ? e.touches[0].clientY : null;
      dy = 0; pull.classList.remove('back');
    }, { passive: true });
    main.addEventListener('touchmove', e => {
      if (from === null) return;
      dy = e.touches[0].clientY - from;
      if (dy <= 0) { show(0, ''); return; }
      e.preventDefault();
      show(Math.min(dy * 0.5, 56), dy > FAR ? 'Let go to refresh' : 'Pull to refresh');
    }, { passive: false });
    const end = () => {
      if (from === null) return;
      from = null;
      pull.classList.add('back');
      if (dy > FAR) {
        show(36, 'Looking…');
        $('refresh').onclick();
        setTimeout(() => show(0, ''), 900);
      } else show(0, '');
    };
    main.addEventListener('touchend', end);
    main.addEventListener('touchcancel', () => { dy = 0; end(); });
  })();
  setTimeout(draw, 5100);
  draw();
</script>
</body>
</html>
