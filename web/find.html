<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Downstage Find</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Downstage Find: every Downstage device on this network, one list grouped by kind, and a detail pane for the one
     picked. The Mac or iOS app does the finding (shared/Finder.swift) and calls window.devices() with what it knows.
     Layout and colours follow downstage-clients/docs/mac-app-standard.md (2026-11-10). -->
<style>
  @font-face { font-family: 'Rajdhani'; font-weight: 700; src: url('fonts/rajdhani-700.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/inter-600.woff2') format('woff2'); }
  :root { --ground: #0B0D10; --panel: #12161B; --raised: #181D23; --edge: #232A32; --rule: #1B2128; --ctl: #2E3640;
          --text: #E8ECEF; --dim: #A3ADB6; --meta: #7C8791; --green: #2FD97B; --amber: #F5A524; --red: #E5484D;
          --sys: -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif; --disp: 'Rajdhani', system-ui, sans-serif;
          --mono: ui-monospace, 'SF Mono', Menlo, monospace;
          /* the iPhone app sets these to the safe area; the Mac leaves them at 0 (step 2 sets --tb-l for the traffic lights) */
          --sa-t: 0px; --sa-r: 0px; --sa-b: 0px; --sa-l: 0px; --win-l: 0px; --tb-l: 0px; }
  * { box-sizing: border-box; }
  body.macfs { --tb-l: 0px; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--ground); color: var(--text); font: 13px/1.4 var(--sys);
         -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; overflow: hidden; }
  button { height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--ctl); background: var(--raised); color: var(--text);
           font: 500 13px var(--sys); white-space: nowrap; cursor: default; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:disabled { opacity: .45; }
  button:focus-visible, input:focus-visible { outline: 2px solid #4C8DFF; outline-offset: 1px; }
  button.pri { background: var(--green); border-color: var(--green); color: #06140C; font-weight: 600; }
  button.del { background: #3A1517; border-color: #3A1517; color: #FF9A9D; }
  button.sm { height: 26px; padding: 0 11px; }
  .ib { width: 30px; height: 28px; padding: 0; border-color: transparent; background: none; color: var(--dim); }
  .ib:hover { background: var(--raised); }
  .ib.on { color: var(--text); }
  .ib svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  input { height: 28px; border-radius: 6px; border: 1px solid var(--edge); background: var(--ground); color: var(--text); font: 13px var(--sys);
          padding: 0 9px; -webkit-user-select: text; user-select: text; outline: none; }
  input::placeholder { color: var(--meta); }
  input:focus { border-color: var(--ctl); }

  /* toolbar */
  header { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px;
           padding: calc(8px + var(--sa-t)) calc(14px + var(--sa-r)) 8px calc(20px + var(--sa-l) + var(--win-l) + var(--tb-l));
           background: var(--panel); border-bottom: 1px solid var(--rule); }
  .doc { min-width: 0; line-height: 1.2; }
  .doc h1 { margin: 0; font: 600 13px var(--sys); white-space: nowrap; }
  .doc #count { font-size: 11px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp { flex: 1; }
  .search { position: relative; width: 200px; }
  .search svg { position: absolute; left: 9px; top: 7.5px; width: 13px; height: 13px; fill: none; stroke: var(--meta); stroke-width: 1.6; stroke-linecap: round; }
  .search input { width: 100%; padding-left: 28px; }
  #upd { display: none; flex: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 14px; font-size: 12.5px; background: var(--raised); border-bottom: 1px solid var(--rule); }
  #upd.on { display: flex; }
  #updText { flex: 1; min-width: 160px; }
  #say { flex: none; padding: 7px calc(18px + var(--sa-r)) 7px calc(18px + var(--sa-l)); font-size: 12.5px; color: var(--dim); border-bottom: 1px solid var(--rule); }
  #say:empty { display: none; }
  #say.warn { color: #F7C066; background: #33270F; }

  /* list and detail */
  #body { flex: 1; min-height: 0; display: flex; }
  main { flex: 1; min-width: 0; overflow: auto; padding-bottom: calc(14px + var(--sa-b)); }
  .gh { display: flex; align-items: center; justify-content: space-between; padding: 14px calc(18px + var(--sa-r)) 6px calc(18px + var(--sa-l)); color: var(--dim); font-size: 12px; font-weight: 600; }
  .dv { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; min-height: 54px;
        padding: 6px calc(18px + var(--sa-r)) 6px calc(18px + var(--sa-l)); border-top: 1px solid var(--rule); }
  .dv:last-child { border-bottom: 1px solid var(--rule); }
  .dv.sel { background: var(--raised); }
  .dv.gone .pic, .dv.gone .nm { opacity: .5; }
  .pic { width: 40px; height: 34px; display: grid; place-items: center; }
  .pic img { max-width: 40px; max-height: 34px; object-fit: contain;
             filter: brightness(1.7) drop-shadow(0 0 .6px rgba(207, 214, 220, .75)) drop-shadow(0 0 .6px rgba(207, 214, 220, .45)); }
  .dv .pic { width: 44px; height: 38px; }
  .dv .pic img { max-width: 44px; max-height: 38px; }
  .nm { min-width: 0; }
  .nm b { display: block; font: 700 16px/1.15 var(--disp); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm span { display: block; font-size: 12px; color: var(--meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; display: inline-flex; align-items: center; white-space: nowrap; }
  .pill.ok { background: #10301D; color: #74E8A8; }
  .pill.warn { background: #33270F; color: #F7C066; }
  .pill.off { background: var(--raised); color: var(--meta); }
  .acts { display: flex; gap: 6px; }
  #pull { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: var(--meta); }
  #pull.back { transition: height .2s; }
  #empty { padding: 56px 24px; text-align: center; color: var(--dim); }
  #empty b { display: block; margin-bottom: 6px; color: var(--text); font: 700 20px var(--disp); letter-spacing: .02em; }
  #empty p { margin: 0 auto 16px; max-width: 440px; }
  #empty .acts { justify-content: center; }
  .gh .ghost { height: 22px; padding: 0 4px; border: 0; background: none; color: var(--meta); font-size: 12px; font-weight: 500; }
  .gh .ghost:hover { color: var(--text); }
  .pop { position: fixed; z-index: 20; width: 280px; background: #1C2229; border: 1px solid var(--ctl); border-radius: 8px; padding: 12px 14px;
         box-shadow: 0 14px 34px rgba(0, 0, 0, .5); }
  .pop .note { margin-top: 10px; }
  .nomatch { padding: 28px 18px; color: var(--meta); text-align: center; }

  aside { flex: none; width: 300px; overflow: auto; background: var(--panel); border-left: 1px solid var(--rule); display: none; }
  body.detail aside { display: block; }
  .dh { display: flex; gap: 12px; align-items: center; padding: 16px 16px 0; }
  .dh .pic { width: 50px; height: 42px; }
  .dh .pic img { max-width: 50px; max-height: 42px; }
  .dh h2 { margin: 0; font: 700 20px/1.15 var(--disp); letter-spacing: .02em; overflow-wrap: anywhere; }
  .dh .sub { color: var(--meta); font-size: 12px; }
  .back { display: none; }
  .health { margin: 14px 16px 0; padding: 5px 10px; border-radius: 11px; display: inline-block; font-size: 12.5px; line-height: 1.35; }
  .health.ok { background: #10301D; color: #74E8A8; }
  .health.warn { background: #33270F; color: #F7C066; }
  .health.off { background: var(--raised); color: var(--meta); }
  .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 8px; font-size: 12.5px; padding: 12px 16px 16px; }
  .kv > span { color: var(--dim); }
  .kv code { font: 12px var(--mono); color: var(--text); -webkit-user-select: text; user-select: text; overflow-wrap: anywhere; }
  .grp { border-top: 1px solid var(--rule); padding: 14px 16px; }
  .grp.btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .grp.ways { display: flex; flex-wrap: wrap; gap: 6px; }
  .grp .hint { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .sl { display: grid; grid-template-columns: 76px minmax(0, 1fr) 40px; align-items: center; gap: 8px; font-size: 12.5px; }
  .sl + .sl { margin-top: 8px; }
  .sl > span { color: var(--dim); }
  .sl input { height: 22px; padding: 0; border: 0; background: none; accent-color: #CFD6DC; min-width: 0; }
  .sl input:disabled { opacity: .35; }
  .sl:has(input:disabled) b { color: var(--meta); }
  .sl b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .note { margin-top: 8px; font-size: 12px; color: var(--meta); }

  /* menus and sheets */
  .menu { position: fixed; z-index: 20; min-width: 200px; background: #1C2229; border: 1px solid var(--ctl); border-radius: 8px; padding: 5px;
          box-shadow: 0 14px 34px rgba(0, 0, 0, .5); font-size: 13px; }
  .menu div { height: 26px; border-radius: 5px; display: flex; align-items: center; padding: 0 12px; }
  .menu div:hover { background: #34404C; }
  .menu div.off { color: var(--meta); pointer-events: none; }
  .menu hr { border: 0; border-top: 1px solid var(--ctl); margin: 5px 0; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(5, 6, 8, .62); display: flex; align-items: flex-start; justify-content: center; padding: 70px 16px 16px; }
  .sheet { width: 420px; max-width: 100%; background: var(--panel); border: 1px solid var(--ctl); border-radius: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); padding: 20px 22px 18px; }
  .sheet h3 { margin: 0 0 6px; font: 600 15px var(--sys); }
  .sheet p { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
  .sheet input { width: 100%; margin-bottom: 16px; }
  .sheet .acts { justify-content: flex-end; gap: 8px; }
  @media (prefers-reduced-motion: no-preference) { .menu, .sheet { animation: pop .14s ease-out; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }

  /* the iPhone: rows stack, the detail is its own page with a back */
  @media (max-width: 640px) {
    header { flex-wrap: wrap; }
    .search { order: 9; width: 100%; }
    #detailBtn { display: none; }
    .dv { grid-template-columns: 44px minmax(0, 1fr) auto; }
    .dv .acts { display: none; }
    aside { position: fixed; inset: 0; z-index: 10; width: auto; border: 0; background: var(--ground);
            padding: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l); }
    .back { display: block; padding: 10px 16px 0; }
    .back button { border-color: transparent; background: none; color: var(--dim); padding: 0; }
    .grp.btns { justify-content: stretch; }
    .grp.btns button { flex: 1; height: 36px; }
  }
</style>
</head>
<body>
<header>
  <div class="doc"><h1>Downstage Find</h1><div id="count">Looking…</div></div>
  <span class="sp"></span>
  <label class="search"><svg viewBox="0 0 14 14"><circle cx="6" cy="6" r="4"/><path d="M9.2 9.2 12.5 12.5"/></svg><input id="q" type="search" placeholder="Search" spellcheck="false" autocapitalize="off" autocorrect="off" title="Name, kind, address or serial (⌘F)"></label>
  <button class="ib" id="refresh" title="Look again (⌘R)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg></button>
  <button class="ib" id="plus" title="Add by address or scan the network"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
  <button class="ib" id="detailBtn" title="Show or hide details"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5"/><path d="M10 2.5v11"/></svg></button>
</header>
<div id="upd"><span id="updText"></span><button class="sm" id="updLater">Later</button><button class="sm pri" id="updGo">Update now</button></div>
<div id="say"></div>
<div id="body">
  <main id="list">
    <div id="pull"></div>
    <div id="rows"></div>
    <div id="empty"></div>
  </main>
  <aside id="detail"></aside>
</div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const native = (action, extra) => { try { window.webkit.messageHandlers.find.postMessage(Object.assign({ action }, extra)); } catch (e) {} };
  const phone = () => matchMedia('(max-width: 640px)').matches;
  const KINDS = {
    one: ['Downstage One', 'devices/one.svg'], view: ['Downstage View', 'devices/view.png'], relay: ['Cue Relay', 'devices/relay.svg'],
    cue: ['Cue', 'devices/cue.svg'], tally: ['Cue', 'devices/cue.svg'], lite: ['Cue Lite', 'devices/lite.svg'],
    mini: ['Cue Mini', 'devices/mini.svg'], 360: ['Cue 360', 'devices/360.svg'],
  };
  const GROUPS = [['Ones', ['one']], ['Views', ['view']], ['Relays', ['relay']], ['Lights', ['cue', 'tally', 'lite', 'mini', '360']]];
  // an unknown kind is a light: the Lights group catches it, as KINDS falls back to the Cue drawing
  const groupOf = d => { const i = GROUPS.findIndex(g => g[1].includes(d.kind)); return i < 0 ? GROUPS.length - 1 : i; };
  const kindOf = d => KINDS[d.kind] || KINDS.cue;
  const isLight = d => !['one', 'view', 'relay'].includes(d.kind);
  const canBlink = d => d.kind !== 'one' && d.kind !== 'view';
  let list = [], started = Date.now(), blinking = {}, held = {}, sliding = false, selKey = null, detailHidden = false, scanning = false, allQuiet = false;

  function appsOf(d) {
    const base = 'http://' + d.host, page = base + ':' + d.port;
    // a device's own page is its Settings, on every device (Rob, 2026-11-03)
    if (d.kind !== 'one') return [{ name: 'Settings', url: page + '/', main: true }];
    // a One's plain / follows that browser's last choice (Touch or Show mode), so Settings asks for Full setup, which
    // opens on its Dashboard (one-system-ui.md, 2026-11-09)
    const a = [{ name: 'Settings', url: page + '/?browser=1', main: true }];
    if (d.hasShow) a.push({ name: 'Show mode', url: page + '/show' });
    a.push({ name: 'Touch', url: page + '/touch' });
    if (d.hasApps) a.push({ name: 'Apps', url: page + '/?browser=1&tab=apps' });
    if (d.companion) a.push({ name: 'Companion', url: base + ':8000/' });
    if (d.ontime) a.push({ name: 'OnTime', url: base + ':4001/editor/' });
    return a;
  }
  const settingsOf = d => appsOf(d)[0].url;
  const companionWord = c => /^live/.test(c) ? (/locked/.test(c) ? 'Live, locked' : 'Live') : /no Companion host/.test(c) ? 'No Companion set'
    : /its Cue/.test(c) ? 'Waiting for its Cue' : /network/.test(c) ? 'Waiting for a network' : c ? 'Finding Companion' : '';
  // A light's health, worded like its own page: the full line for the detail, and a short one for the row's pill.
  // weak is the light's own packet loss to its gateway or its Cue, held 10 s, so it can be high at a strong signal:
  // the signal is its own item (Cue Firmware, 2026-11-03)
  function healthOf(d) {
    const h = d.health, c = String(h && h.companion || '');
    if (!h || !Object.keys(h).length) return null;
    const near = id => { const o = list.find(x => x.key === id); return o ? o.name : 'its Relay'; };
    let warn = true, text, short;
    if (h.setup) { text = 'In setup: join its hotspot to choose a network'; short = 'In setup'; }
    else if (h.why) { text = h.why; short = 'Needs a look'; }
    else if (h.relayed) { warn = false; text = 'Live, linked to ' + near(h.via); }
    else if (/^live/.test(c)) { warn = false; text = 'Live on Companion'; }
    else if (/no Companion host/.test(c)) text = short = 'No Companion set';
    else if (/its Cue/.test(c)) { text = 'Waiting for the Cue it is linked to'; short = 'Waiting for its Cue'; }
    else if (/network/.test(c)) { text = 'Waiting for a network'; short = 'No network'; }
    else text = short = 'Finding Companion';
    // the pill keeps the first reason it found: the light's own state, then packet loss, signal, battery
    const more = [];
    const add = (t, s, w) => { more.push(t); if (w) { if (!warn) short = s; warn = true; } };
    if (h.weak === 1) add('WiFi dropping packets', 'Dropping packets', true);
    if (h.weak === 2) add('CueLink dropping packets', 'CueLink dropping packets', true);
    if (!h.relayed && h.ssid && h.rssi < -75) add('Weak WiFi signal (' + h.rssi + ' dBm)', 'Weak signal', true);
    if (typeof h.battery === 'number') {
      const low = h.battery < 20 && !h.charging;
      add('Battery ' + h.battery + '%' + (h.charging ? ', charging' : low ? ', not charging' : ''), 'Battery ' + h.battery + '%', low);
    }
    if (!warn) short = 'Live' + (typeof h.battery === 'number' ? ' · ' + h.battery + '%' : '');
    return { warn, text: [text].concat(more).join(' · '), short };
  }
  // A Relay's own verdict (health_ok, health_why worst first, joined by " · "), worded like a light's line
  function relayOf(d) {
    const h = d.health || {};
    if (typeof h.health_ok !== 'boolean') return null;   // a Relay from before 0.186.45
    const linked = h.showing ? ' · ' + h.showing : '';
    if (h.health_ok) return { cls: 'ok', short: 'Live', text: 'Live on Companion' + linked };
    const why = String(h.health_why || 'Needs a look');
    return { cls: 'warn', short: why.split(' · ')[0], text: why + linked };
  }
  // The one pill a row shows: green when it's fine, amber when it needs a look, grey when it isn't answering
  function statusOf(d) {
    if (d.gone) return { cls: 'off', short: 'Not seen', text: (d.lastSeen ? 'Last seen ' + ago(d.lastSeen) + '. ' : 'Not answering. ') + 'It may be unplugged, or off this network.' };
    const r = d.kind === 'relay' ? relayOf(d) : null;
    if (r) return r;
    const h = isLight(d) ? healthOf(d) : null;
    if (h) return { cls: h.warn ? 'warn' : 'ok', short: h.short, text: h.text };
    return { cls: 'ok', short: 'Online', text: 'On the network' };
  }
  function subOf(d) {
    const h = d.health || {};
    if (d.gone && d.lastSeen) return kindOf(d)[0] + ' · last seen ' + ago(d.lastSeen);
    if (isLight(d) && h.relayed && !d.gone) { const o = list.find(x => x.key === h.via); return kindOf(d)[0] + ' · linked to ' + (o ? o.name : 'its Relay'); }
    return kindOf(d)[0] + ' · ' + d.host;
  }
  function ago(ms) {
    const s = Math.max(0, (Date.now() - ms) / 1000), m = Math.round(s / 60), h = Math.round(s / 3600), d = Math.round(s / 86400);
    return s < 60 ? 'just now' : m < 60 ? m + ' min ago' : h < 24 ? h + (h === 1 ? ' hour ago' : ' hours ago') : d + (d === 1 ? ' day ago' : ' days ago');
  }
  const signalWord = rssi => rssi >= -60 ? 'good signal' : rssi >= -72 ? 'fair signal' : 'weak signal';

  // A light's own brightness and its Hex's, where its /status has them (0.186.38): always a percent, 1-100. A value
  // just sent is held until the light reports it, so the slider doesn't jump back while the next look is on its way
  function brightOf(d) {
    const h = d.health || {}, rows = [];
    if (typeof h.brightpct === 'number') rows.push(['light', 'Brightness', h.brightpct, !!h.tokenSet]);
    if (typeof h.hexBright === 'number') rows.push(['hex', 'Hex', h.hexBright, !!h.tokenSet]);   // /follow takes the PIN too since 0.186.39
    if (!rows.length || d.gone) return '';
    const html = rows.map(([part, label, v, locked]) => {
      const id = d.key + ':' + part, w = held[id];
      if (w && (w.pct === v || Date.now() > w.until)) delete held[id];
      const pct = held[id] ? held[id].pct : v;
      return '<label class="sl"' + (locked ? ' title="This light has a Cue PIN. Change its brightness in Settings."' : '') + '><span>' + label + '</span>' +
             '<input type="range" min="1" max="100" step="1" value="' + pct + '" data-key="' + esc(d.key) + '" data-part="' + part + '"' + (locked ? ' disabled' : '') + '>' +
             '<b>' + pct + '%</b></label>';
    }).join('');
    return '<div class="grp">' + html + (rows.some(r => r[3]) ? '<div class="note">Cue PIN set: change its brightness in Settings</div>' : '') + '</div>';
  }

  const matches = (d, q) => !q || [d.name, kindOf(d)[0], d.host, d.serial, d.key].some(v => String(v || '').toLowerCase().includes(q));
  function shown() {
    const q = $('q').value.trim().toLowerCase();
    return list.filter(d => matches(d, q)).sort((a, b) => (groupOf(a) - groupOf(b)) || (!!a.gone - !!b.gone) ||
      String(a.name).localeCompare(String(b.name), undefined, { numeric: true }));
  }
  function blinkBtn(d, cls) {
    return '<button class="' + cls + '" data-blink="' + esc(d.key) + '" title="Blink this ' + (d.kind === 'relay' ? 'Relay' : 'light') + ' so you can see which one it is (Space)"' +
           (d.gone || blinking[d.key] ? ' disabled' : '') + '>' + (blinking[d.key] ? 'Blinking…' : 'Blink') + '</button>';
  }
  function row(d) {
    const s = statusOf(d), k = kindOf(d);
    const acts = (canBlink(d) && !d.gone ? blinkBtn(d, 'sm') : '') +
      (d.gone ? '<button class="sm" data-forget="' + esc(d.key) + '">Forget</button>' : '<button class="sm" data-url="' + esc(settingsOf(d)) + '">Settings</button>');
    return '<div class="dv' + (d.key === selKey ? ' sel' : '') + (d.gone ? ' gone' : '') + '" data-key="' + esc(d.key) + '">' +
           '<div class="pic"><img alt="" src="' + esc(k[1]) + '"></div>' +
           '<div class="nm"><b>' + esc(d.name) + '</b><span>' + esc(subOf(d)) + '</span></div>' +
           '<span class="pill ' + s.cls + '" title="' + esc(s.text) + '">' + esc(s.short) + '</span><div class="acts">' + acts + '</div></div>';
  }
  function detail(d) {
    const k = kindOf(d), s = statusOf(d), h = d.health || {};
    const kv = d.host ? [['Address', '<code>' + esc(d.host) + (d.port && d.port !== 80 ? ':' + d.port : '') + '</code>']] : [];
    if (d.gone && d.lastSeen) kv.push(['Last seen', esc(ago(d.lastSeen))]);
    if (d.serial || isLight(d) || d.kind === 'relay') kv.push(['Serial', '<code>' + esc(d.serial || d.key) + '</code>']);
    if (isLight(d) && !d.gone) {
      if (h.relayed) { const o = list.find(x => x.key === h.via); kv.push(['Network', 'Linked to ' + esc(o ? o.name : 'its Relay') + ' over CueLink']); }
      else if (h.ssid) kv.push(['Network', '<span title="' + esc(h.rssi) + ' dBm">' + esc(h.ssid) + (typeof h.rssi === 'number' ? ' · ' + signalWord(h.rssi) : '') + '</span>']);
      const cw = companionWord(String(h.companion || ''));
      if (cw && !h.relayed) kv.push(['Companion', esc(cw)]);
    }
    if (d.kind === 'relay' && !d.gone && h.showing) kv.push(['Lights', esc(h.showing)]);
    if (d.kind === 'one' && !d.gone) {
      kv.push(['Companion', d.companion ? 'Running' : 'Not running']);
      kv.push(['OnTime', d.ontime ? 'Running' : 'Not running']);
    }
    const ways = d.kind === 'one' && !d.gone ? appsOf(d).slice(1) : [];
    return '<div class="back"><button data-back>‹ Devices</button></div>' +
      '<div class="dh"><div class="pic"><img alt="" src="' + esc(k[1]) + '"></div><div><h2>' + esc(d.name) + '</h2><div class="sub">' +
      esc(k[0] + (d.version ? ' · ' + (isLight(d) || d.kind === 'relay' ? 'firmware ' : '') + d.version : '')) + '</div></div></div>' +
      '<div class="health ' + s.cls + '">' + esc(s.text) + '</div>' +
      '<div class="kv">' + kv.map(([a, b]) => '<span>' + a + '</span><div>' + b + '</div>').join('') + '</div>' +
      brightOf(d) +
      (ways.length ? '<div class="grp ways">' + ways.map(a => '<button class="sm" data-url="' + esc(a.url) + '">' + esc(a.name) + '</button>').join('') + '</div>' : '') +
      '<div class="grp btns">' + (canBlink(d) && !d.gone ? blinkBtn(d, '') : '') +
      (d.gone ? '<button class="del" data-forget="' + esc(d.key) + '">Forget</button>' : '<button class="pri" data-url="' + esc(settingsOf(d)) + '">Open Settings</button>') + '</div>' +
      (window.downstageMobile ? '' : '<div class="grp"><p class="hint">Right-click a device to copy its address or serial, open it in a browser or forget it.</p></div>');
  }
  function countLine() {
    if (!list.length) return Date.now() - started > 5000 ? 'Nothing found yet' : 'Looking…';
    const look = list.filter(d => !d.gone && statusOf(d).cls === 'warn').length, gone = list.filter(d => d.gone).length;
    return [list.length + (list.length === 1 ? ' device' : ' devices'), look ? look + (look === 1 ? ' needs a look' : ' need a look') : '', gone ? gone + ' not seen' : '']
      .filter(Boolean).join(' · ');
  }
  function draw() {
    const all = shown();
    let html = '';
    for (const [gi, [title]] of GROUPS.entries()) {
      const g = all.filter(d => groupOf(d) === gi);
      const extra = title === 'Lights' && allLights().length >= 2 ? '<button class="ghost" data-allbright title="One slider for every light">Brightness for all ▾</button>' : '';
      if (g.length) html += '<div class="gh">' + title + extra + '</div>' + g.map(row).join('');
    }
    if (list.length && !all.length) html = '<div class="nomatch">No device matches “' + esc($('q').value.trim()) + '”.</div>';
    $('rows').innerHTML = html;
    $('count').textContent = countLine();
    const sel = list.find(d => d.key === selKey);
    if (!sel) selKey = null;
    document.body.classList.toggle('detail', !!sel && (phone() || !detailHidden));
    $('detail').innerHTML = sel ? detail(sel) : '';
    $('detailBtn').classList.toggle('on', !!sel && !detailHidden);
    $('detailBtn').disabled = !sel;
    tellState({ selected: !!sel, detail: !!sel && !detailHidden, scanning });
    // Nothing is answering at all: on a Mac that is most often Local Network turned off for Find, which blocks every
    // connection while Bonjour still lists the devices (Rob's bench, 2026-11-05)
    if (list.some(d => d.heard) && !list.some(d => d.answered) && Date.now() - started > 8000 && !$('say').textContent) {
      window.findSay('Nothing is answering. ' + (window.downstageMobile ? 'In Settings, open Downstage Find and check Local Network is on.'
        : 'In System Settings, open Privacy & Security, then Local Network, and check Downstage Find is on.'), true);
      allQuiet = true;
    } else if (allQuiet && list.some(d => d.answered)) { allQuiet = false; window.findSay(''); }
    const none = !list.length;
    $('empty').style.display = none ? '' : 'none';
    if (none) {
      const waited = Date.now() - started > 5000;
      $('empty').innerHTML = waited
        ? '<b>Nothing found yet</b><p>Check ' + (window.downstageMobile ? 'Local Network is on for this app in Settings, and that this ' + window.downstageMobile : 'this Mac') +
          ' is on the same network as your devices. Some networks hide devices from each other: add one by its address, or scan the network.</p>' +
          '<div class="acts"><button data-add>Add by address…</button><button data-scan' + (scanning ? ' disabled' : '') + '>' + (scanning ? 'Scanning…' : 'Scan network…') + '</button></div>'
        : '<b>Looking…</b><p>Asking the network for Downstage devices.</p>';
    }
  }
  // a slider redrawn mid-drag would drop out from under the finger, so a drag holds the redraws
  window.devices = d => { list = d; if (!sliding) draw(); };
  window.findSay = (text, warn) => { $('say').textContent = text || ''; $('say').className = warn ? 'warn' : ''; };
  window.scanState = running => { scanning = running; draw(); };

  // ── updates: only inside the Mac app (macapp/updater.swift). A check at launch stays quiet unless there's
  // something new, because a venue network with no internet isn't news. Nothing installs until it's pressed ──
  const updBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.updates;
  let updLater = false;
  window.updAsked = false;
  window.updateState = u => {
    const line = { checking: 'Checking for updates…', current: u.message || 'You’re up to date.', available: 'Version ' + u.latest + ' is ready.', downloading: 'Downloading ' + u.latest + '…',
                   installing: 'Installing ' + u.latest + '. The app will reopen.', error: u.message || 'Couldn’t update.' }[u.status];
    const news = ['available', 'downloading', 'installing'].includes(u.status);
    if (window.updAsked) updLater = false;
    $('upd').classList.toggle('on', !!line && !updLater && (news || window.updAsked));
    $('updText').textContent = 'This is version ' + u.version + '. ' + (line || '');
    $('updText').title = u.status === 'available' ? (u.notes || '') : '';
    $('updGo').style.display = u.status === 'available' ? '' : 'none';
    $('updLater').style.display = u.status === 'installing' || u.status === 'downloading' ? 'none' : '';
    $('updLater').textContent = u.status === 'available' ? 'Later' : 'Close';
  };
  if (updBridge) {
    $('updGo').onclick = () => { window.updAsked = true; updBridge.postMessage('install'); };
    $('updLater').onclick = () => { updLater = true; window.updAsked = false; $('upd').classList.remove('on'); };
    updBridge.postMessage('ready');
  }

  // ── actions ──
  const open = url => native('open', { url });
  function blink(key) {
    const d = list.find(x => x.key === key);
    if (!d || !canBlink(d) || d.gone || blinking[key]) return;
    // the light blinks for about 5 s, so the button rests that long and a second press doesn't stack
    native('identify', { key });
    blinking[key] = setTimeout(() => { delete blinking[key]; draw(); }, 5000);
    draw();
  }
  function forget(key) { native('forget', { key }); list = list.filter(d => d.key !== key); if (selKey === key) selKey = null; draw(); }
  function copy(text) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.find) native('copy', { text });
    else if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  }
  function select(key, scroll) {
    selKey = key; detailHidden = false; draw();
    const el = document.querySelector('.dv[data-key="' + CSS.escape(key) + '"]');
    if (el && scroll) el.scrollIntoView({ block: 'nearest' });
  }
  function lookAgain() { started = Date.now(); allQuiet = false; window.findSay(''); native('refresh'); draw(); }

  // ── menus and sheets ──
  function closeMenus() { document.querySelectorAll('.menu, .pop').forEach(m => m.remove()); }

  // Brightness for all: one slider for every light here that has one. A light with a Cue PIN is skipped and counted;
  // each light gets one write, when the slider is let go, as with its own slider
  const allLights = () => list.filter(d => isLight(d) && !d.gone && d.health && typeof d.health.brightpct === 'number');
  function allBright(x, y) {
    closeMenus();
    const ls = allLights(), open = ls.filter(d => !d.health.tokenSet), pinned = ls.length - open.length;
    const start = open.length ? Math.round(open.reduce((n, d) => n + d.health.brightpct, 0) / open.length) : 50;
    const p = document.createElement('div');
    p.className = 'pop';
    p.innerHTML = '<label class="sl"><span>All lights</span><input type="range" min="1" max="100" step="1" value="' + start + '"' + (open.length ? '' : ' disabled') + '><b>' + start + '%</b></label>' +
      '<div class="note">' + (open.length ? 'Sets ' + open.length + (open.length === 1 ? ' light' : ' lights') + ' when you let go.' : 'Every light here has a Cue PIN.') +
      (pinned ? ' ' + pinned + ' with a Cue PIN ' + (pinned === 1 ? 'is' : 'are') + ' skipped: change ' + (pinned === 1 ? 'it' : 'those') + ' in Settings.' : '') + '</div>';
    document.body.appendChild(p);
    p.style.left = Math.max(6, Math.min(x - p.offsetWidth, innerWidth - p.offsetWidth - 6)) + 'px';
    p.style.top = Math.max(6, Math.min(y, innerHeight - p.offsetHeight - 6)) + 'px';
    const r = p.querySelector('input');
    p.addEventListener('click', e => e.stopPropagation());
    r.addEventListener('input', () => { r.nextElementSibling.textContent = r.value + '%'; });
    r.addEventListener('change', () => {
      const pct = Math.max(1, Math.min(100, Math.round(+r.value)));
      for (const d of open) {
        held[d.key + ':light'] = { pct, until: Date.now() + 5000 };
        native('bright', { key: d.key, part: 'light', pct });
      }
      window.findSay('Brightness ' + pct + '% sent to ' + open.length + (open.length === 1 ? ' light' : ' lights') +
        (pinned ? '. Skipped ' + pinned + ' with a Cue PIN.' : '.'), false);
      clearTimeout(allBright.t);
      allBright.t = setTimeout(() => { if (/^Brightness /.test($('say').textContent)) window.findSay(''); }, 6000);
      draw();
    });
  }
  function menu(x, y, items) {
    closeMenus();
    const m = document.createElement('div');
    m.className = 'menu';
    m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : '<div data-i="' + i + '"' + (it[2] ? ' class="off"' : '') + '>' + esc(it[0]) + '</div>').join('');
    document.body.appendChild(m);
    m.style.left = Math.max(6, Math.min(x, innerWidth - m.offsetWidth - 6)) + 'px';
    m.style.top = Math.max(6, Math.min(y, innerHeight - m.offsetHeight - 6)) + 'px';
    m.addEventListener('click', e => { const i = (e.target.closest('[data-i]') || {}).dataset; if (i) { closeMenus(); items[+i.i][1](); } });
  }
  function sheet(title, text, okLabel, input, ok) {
    const s = document.createElement('div');
    s.className = 'scrim';
    s.innerHTML = '<div class="sheet" role="dialog"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
      (input ? '<input spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="' + esc(input) + '">' : '') +
      '<div class="acts"><button data-no>Cancel</button><button class="pri" data-ok>' + esc(okLabel) + '</button></div></div>';
    document.body.appendChild(s);
    const field = s.querySelector('input'), done = yes => { const v = field ? field.value : ''; s.remove(); if (yes) ok(v); };
    s.querySelector('[data-no]').onclick = e => { e.stopPropagation(); done(false); };
    s.querySelector('[data-ok]').onclick = e => { e.stopPropagation(); done(true); };
    s.addEventListener('keydown', e => { if (e.key === 'Escape') done(false); if (e.key === 'Enter') { e.preventDefault(); done(true); } e.stopPropagation(); });
    s.addEventListener('mousedown', e => { if (e.target === s) done(false); });
    (field || s.querySelector('[data-ok]')).focus();
  }
  function addByAddress() {
    sheet('Add by address', 'For a network that hides devices from each other. Type the device’s address and it joins the list like any other.', 'Add', '192.168.1.50', v => {
      v = v.trim().replace(/^https?:\/\//, '').replace(/[:/].*$/, '');
      if (v) native('add', { host: v });
    });
  }
  function scanNetwork() {
    if (scanning) return;
    sheet('Scan this network?', 'This knocks on every address on your network. It takes a few seconds, but some venue networks treat it as an attack, so ask first if it isn’t your network.',
      'Scan', null, () => native('scan'));
  }
  // the Mac app's menus run the page's own commands
  window.findToggleDetail = () => { detailHidden = !detailHidden; draw(); };
  window.findCmd = cmd => {
    if (document.querySelector('.scrim')) return;
    ({ add: addByAddress, scan: scanNetwork, look: lookAgain, detail: window.findToggleDetail,
       search: () => { $('q').focus(); $('q').select(); } }[cmd] || (() => {}))();
  };
  let told = '';
  function tellState(st) {
    const k = JSON.stringify(st);
    if (k !== told && window.downstageMac) { told = k; native('state', st); }
  }
  // In the Mac app the toolbar is the title bar: the app drags the window from its empty space, so it needs to know
  // where the toolbar's controls are
  function tellDragZone() {
    if (!window.downstageMac) return;
    const h = document.querySelector('header');
    const rects = [...h.querySelectorAll('button, .search')].filter(e => e.offsetParent).map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.width, r.height]; });
    native('dragzone', { height: h.getBoundingClientRect().bottom, rects });
  }

  $('refresh').onclick = lookAgain;
  $('plus').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    menu(r.right - 200, r.bottom + 4, [['Add by address…', addByAddress], [scanning ? 'Scanning…' : 'Scan network…', scanNetwork, scanning]]);
    e.stopPropagation();
  };
  $('detailBtn').onclick = window.findToggleDetail;
  $('q').addEventListener('input', draw);
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('q').value = ''; draw(); $('q').blur(); }
    if (e.key === 'ArrowDown' || e.key === 'Enter') { const f = shown()[0]; if (f) { $('q').blur(); select(f.key, true); } e.preventDefault(); }
  });

  document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
  // on the list and detail, not the document: iOS only passes a tap on a plain row to a listener below the body
  $('body').addEventListener('click', e => {
    const t = e.target.closest('button');
    if (t && t.dataset.url) return open(t.dataset.url);
    if (t && t.dataset.blink) return blink(t.dataset.blink);
    if (t && t.dataset.forget) return forget(t.dataset.forget);
    if (t && 'add' in t.dataset) return addByAddress();
    if (t && 'scan' in t.dataset) return scanNetwork();
    if (t && 'back' in t.dataset) { selKey = null; return draw(); }
    if (t && 'allbright' in t.dataset) { const b = t.getBoundingClientRect(); e.stopPropagation(); return allBright(b.right, b.bottom + 4); }
    const r = e.target.closest('.dv');
    if (r && !t) select(r.dataset.key);
  });
  document.addEventListener('contextmenu', e => {
    const r = e.target.closest('.dv');
    if (!r) { if (!e.target.closest('input, code')) e.preventDefault(); return; }
    e.preventDefault();
    const d = list.find(x => x.key === r.dataset.key);
    if (!d) return;
    select(d.key);
    const items = d.host ? [['Copy address', () => copy(d.host)]] : [];
    if (d.serial) items.push(['Copy serial', () => copy(d.serial)]);
    items.push(['Open in browser', () => open(settingsOf(d)), d.gone || !d.host]);
    if (canBlink(d)) items.push(['Blink', () => blink(d.key), d.gone || !!blinking[d.key]]);
    items.push('-', ['Forget', () => forget(d.key)]);
    menu(e.clientX, e.clientY, items);
  });
  addEventListener('blur', closeMenus);
  $('list').addEventListener('scroll', closeMenus);

  // keyboard: arrows move, Return opens Settings, Space blinks, ⌘R looks again, ⌘F searches
  document.addEventListener('keydown', e => {
    if (document.querySelector('.scrim')) return;
    const cmd = e.metaKey || e.ctrlKey;
    if (cmd && e.key.toLowerCase() === 'f') { e.preventDefault(); $('q').focus(); $('q').select(); return; }
    if (cmd && e.key.toLowerCase() === 'r') { e.preventDefault(); lookAgain(); return; }
    if (e.key === 'Escape') { closeMenus(); return; }
    if (e.target.closest && e.target.closest('input')) return;
    const all = shown(), i = all.findIndex(d => d.key === selKey), d = all[i];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = all[i < 0 ? 0 : Math.max(0, Math.min(all.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
      if (n) select(n.key, true);
    } else if (e.key === 'Enter' && d && !d.gone) { e.preventDefault(); open(settingsOf(d)); }
    else if (e.key === ' ' && d) { e.preventDefault(); blink(d.key); }
  });

  // brightness: the number follows the drag; the light hears once, when the slider is let go (each change is written
  // to its flash)
  $('detail').addEventListener('pointerdown', e => { if (e.target.matches('input[type=range]')) sliding = true; });
  $('detail').addEventListener('input', e => {
    if (e.target.matches('input[type=range]')) e.target.nextElementSibling.textContent = e.target.value + '%';
  });
  $('detail').addEventListener('change', e => {
    const r = e.target;
    if (!r.matches('input[type=range]')) return;
    const pct = Math.max(1, Math.min(100, Math.round(+r.value)));
    held[r.dataset.key + ':' + r.dataset.part] = { pct, until: Date.now() + 5000 };
    native('bright', { key: r.dataset.key, part: r.dataset.part, pct });
    sliding = false; draw();
  });
  const letGo = () => { if (sliding) setTimeout(() => { if (sliding) { sliding = false; draw(); } }, 0); };
  addEventListener('pointerup', letGo);
  addEventListener('pointercancel', letGo);
  addEventListener('resize', () => { draw(); tellDragZone(); });

  // pull the list down to refresh, on touch screens: from the top of the list, past 64 px, then let go
  (() => {
    const main = $('list'), pull = $('pull'), FAR = 64;
    let from = null, dy = 0;
    const show = (h, text) => { pull.style.height = h + 'px'; pull.textContent = text; };
    main.addEventListener('touchstart', e => {
      from = main.scrollTop <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null;
      dy = 0; pull.classList.remove('back');
    }, { passive: true });
    main.addEventListener('touchmove', e => {
      if (from === null) return;
      dy = e.touches[0].clientY - from;
      if (dy <= 0) { show(0, ''); return; }
      e.preventDefault();
      show(Math.min(dy * 0.5, 56), dy > FAR ? 'Let go to refresh' : 'Pull to refresh');
    }, { passive: false });
    const end = () => {
      if (from === null) return;
      from = null;
      pull.classList.add('back');
      if (dy > FAR) {
        show(36, 'Looking…');
        lookAgain();
        setTimeout(() => show(0, ''), 900);
      } else show(0, '');
    };
    main.addEventListener('touchend', end);
    main.addEventListener('touchcancel', () => { dy = 0; end(); });
  })();
  setTimeout(draw, 5100);
  tellDragZone();
  if (document.fonts) document.fonts.ready.then(tellDragZone);
  setTimeout(draw, 8100);
  setInterval(() => { if (!sliding && list.some(d => d.gone && d.lastSeen)) draw(); }, 30000);
  draw();
</script>
</body>
</html>
